name: Direct Cloudflare Pages deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heatguard-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy prepared static build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_PAGES_PROJECT"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.158.0 pages deploy apps/web/dist --project-name "$CLOUDFLARE_PAGES_PROJECT"

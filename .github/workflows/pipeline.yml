name: Three-hourly validated snapshots
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: heatguard-pipeline
  cancel-in-progress: false
jobs:
  publish:
    if: vars.HEATGUARD_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: 0.11.33
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m pipeline.publish --fetch
      - run: uv run python scripts/validate-data.py
      - name: Publish data branch without a source build
        env:
          DATA_BRANCH: data
        run: |
          git config user.name 'heatguard-data-publisher'
          git config user.email 'heatguard-data-publisher@users.noreply.github.com'
          git fetch origin data
          git worktree add /tmp/heatguard-data origin/data
          cp -a apps/web/public/data/. /tmp/heatguard-data/public-data/
          cd /tmp/heatguard-data
          git add public-data
          git diff --cached --quiet || git commit -m "Publish validated heat snapshot"
          git push origin HEAD:data
      - name: Reuse verified source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          gh run download "$run_id" --name heatguard-web --dir apps/web/dist
          uv run python scripts/assemble-deploy.py
      - name: Direct static deployment
        if: vars.CLOUDFLARE_PAGES_PROJECT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: npx --yes wrangler@4.158.0 pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pipeline-evidence
          path: reports/
          retention-days: 14

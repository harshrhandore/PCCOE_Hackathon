name: HeatGuard CI
on:
  push:
    branches-ignore: [data]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: 0.11.33
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run typecheck
      - run: npm test
      - run: uv run python -m pytest --junitxml=reports/tests/pytest.xml
      - run: uv run python scripts/validate-data.py
      - run: npm run build
      - run: uv run python scripts/assemble-deploy.py
      - run: uv run python scripts/secret-scan.py
      - name: Start isolated local Auth and PostGIS
        id: local-db
        run: |
          npm run db:start
          npm run staff:bootstrap
      - name: Real local database and Auth integration
        env:
          HEATGUARD_RUN_DB_TESTS: '1'
        run: uv run python -m pytest services/api/tests/test_local_database_integration.py --junitxml=reports/tests/local-database.xml
      - run: npx playwright install --with-deps chromium
      - name: Browser flows and axe
        run: |
          npm start -- --no-build > /tmp/heatguard-local.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8081/ > /dev/null && break; sleep 1; done
          export HEATGUARD_TEST_BASE_URL=http://127.0.0.1:8081
          export HEATGUARD_RUN_DB_TESTS=1
          npm run test:e2e
      - name: Three production mobile audits and size budgets
        env:
          HEATGUARD_TEST_BASE_URL: http://127.0.0.1:8081/
        run: npm run audit:local
      - name: Stop owned local database stack
        if: always() && steps.local-db.outcome != 'skipped'
        run: npm run db:stop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: heatguard-evidence
          path: reports/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && github.event_name != 'pull_request'
        with:
          name: heatguard-web
          path: apps/web/dist/
          retention-days: 30

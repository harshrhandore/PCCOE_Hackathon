# Local only. Start through npm run db:start to enforce loopback port binding.
project_id = "heatguard-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = []
jwt_expiry = 1800
signing_keys_path = "../data/raw/local/signing-keys.json"
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 0
minimum_password_length = 12

[auth.email]
enabled = true
enable_confirmations = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
